[package]
name = "daw-ai"
version = "0.2.2"
edition = "2021"

[workspace]
members = [
    "crates/daw-core", "crates/daw-io", "crates/daw-tui", "crates/daw-gpui",
    # Hermetic CLAP test fixtures (cdylibs loaded by daw-core's host tests).
    "crates/daw-clap-testplug-gain", "crates/daw-clap-testplug-tone",
    "crates/daw-mcp",
]
exclude = ["vendor/cpal", "vendor/gpui_util", "vendor/taffy"]
resolver = "2"

# Style lints that fight real-time audio code: indexed loops over parallel
# buffers, unboxed event enums (no allocation on the audio thread) and wide
# DSP constructors are deliberate here. Everything else in Clippy stays on.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

[lints]
workspace = true

[dependencies]
daw-tui             = { path = "crates/daw-tui" }
daw-core            = { path = "crates/daw-core" }
daw-io              = { path = "crates/daw-io" }
daw-gpui            = { path = "crates/daw-gpui" }
anyhow              = "1"
crossbeam-channel   = "0.5"

# Keep GPUI development/test builds practical on smaller workstations.
# `cargo run` / ./run-gui.sh must be usable for real work: an unoptimized UI
# toolkit and synth cost ~9x per frame (measured with the daw-gpui
# `frame_cost_on_a_large_song` benchmark). Dependencies are built fully
# optimized once; workspace crates get incremental builds, light optimization,
# and line-level debug info for rust-gdb and backtraces.
[profile.dev]
debug = 1
incremental = true
opt-level = 1

[profile.dev.package."*"]
debug = 0
opt-level = 3

[profile.test]
debug = 1
incremental = false

[profile.test.package."*"]
debug = 0

# CPAL 0.15.3 ALSA shutdown fix; see vendor/cpal/DAW-PATCH.md.
[patch.crates-io]
cpal = { path = "vendor/cpal" }
# GPUI 0.2.2 pins Taffy 0.9.0, whose upstream Grid dependency is vulnerable.
taffy = { path = "vendor/taffy" }
# GPUI test support uses Git2 through this crate.
gpui_util = { path = "vendor/gpui_util" }
