[package]
name = "daw-flow-model-m"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
clack-plugin = "0.1"
clack-extensions = { version = "0.1", features = ["clack-plugin", "audio-ports", "note-ports", "params", "state"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmi = { version = "0.46", default-features = false, features = ["std"] }
