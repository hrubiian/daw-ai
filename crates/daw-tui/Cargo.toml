[package]
name = "daw-tui"
version = "0.2.2"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
daw-core            = { path = "../daw-core" }
daw-io              = { path = "../daw-io" }
ratatui             = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm           = { version = "0.29", features = ["event-stream"] }
anyhow              = "1"
crossbeam-channel   = "0.5"
rustfft             = "6"

[lints]
workspace = true
