[package]
name = "daw-mcp"
version = "0.2.2"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
daw-io = { path = "../daw-io" }
daw-core = { path = "../daw-core" }
rmcp = { version = "3.9.0", default-features = false, features = ["macros", "server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
hound = "3"
base64 = "0.22"

[lib]
name = "daw_mcp"
path = "src/lib.rs"

[[bin]]
name = "daw-mcp"
path = "src/main.rs"

[dev-dependencies]
daw-io = { path = "../daw-io", features = ["test-support"] }

[lints]
workspace = true
