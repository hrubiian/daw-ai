[package]
name = "daw-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
daw-core = { path = "../daw-core" }
rmcp = { version = "1.7", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
hound = "3"

[lib]
name = "daw_mcp"
path = "src/lib.rs"

[[bin]]
name = "daw-mcp"
path = "src/main.rs"
