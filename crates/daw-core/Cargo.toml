[package]
name = "daw-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
cpal           = "0.15"
ringbuf        = "0.4"
crossbeam-channel = "0.5"
rustysynth     = "1"
anyhow         = "1"
hound          = "3"
clack-host       = "0.1"
clack-extensions = { version = "0.1", features = ["clack-host", "audio-ports", "params", "state", "note-ports"] }
base64           = "0.22"
rustfft        = "6"

sha2 = "0.10"
